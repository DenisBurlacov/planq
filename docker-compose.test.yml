services:
  postgres:
    image: postgres:15-alpine
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: planq
      POSTGRES_PASSWORD: planq_secret
      POSTGRES_DB: planq_db
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U planq']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    ports:
      - '4000:4000'
    environment:
      NODE_ENV: test
      PORT: 4000
      DATABASE_URL: postgresql://planq:planq_secret@postgres:5432/planq_db
      CORS_ORIGIN: http://localhost:3000
      RESET_TOKEN: test_reset_token
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - '3000:80'
    depends_on:
      - backend
