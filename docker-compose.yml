services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-planq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-planq_secret}
      POSTGRES_DB: ${POSTGRES_DB:-planq_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-planq} -d ${POSTGRES_DB:-planq_db}']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    ports:
      - '4000:4000'
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-planq}:${POSTGRES_PASSWORD:-planq_secret}@postgres:5432/${POSTGRES_DB:-planq_db}
      CORS_ORIGIN: http://localhost:3000
      RESET_TOKEN: ${RESET_TOKEN:-super_secret_reset_token_change_in_production}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev_access_secret_change_in_production_32}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev_refresh_secret_change_in_production_32}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:4000/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    restart: unless-stopped
    ports:
      - '3000:80'
    depends_on:
      backend:
        condition: service_healthy

  # Monitoring stack (optional)
  # Start with: docker compose --profile monitoring up
  grafana:
    image: grafana/grafana:latest
    profiles: ['monitoring']
    restart: unless-stopped
    ports:
      - '${GRAFANA_PORT:-3200}:3000'
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/monitoring/grafana:/etc/grafana/provisioning

  loki:
    image: grafana/loki:latest
    profiles: ['monitoring']
    restart: unless-stopped
    ports:
      - '${LOKI_PORT:-3100}:3100'
    command: -config.file=/etc/loki/loki.yaml
    volumes:
      - ./docker/monitoring/loki:/etc/loki
      - loki_data:/loki

  promtail:
    image: grafana/promtail:latest
    profiles: ['monitoring']
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail.yaml
    volumes:
      - ./docker/monitoring/promtail:/etc/promtail
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  postgres_data:
  grafana_data:
  loki_data:
